name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck → Lint → Test → Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Install Playwright browsers
        run: pnpm --filter @score/gui exec playwright install --with-deps chromium

      - name: E2e tests (Electron via Xvfb)
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" pnpm --filter @score/gui test:e2e

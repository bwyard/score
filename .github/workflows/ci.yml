name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck → Lint → Test → Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

  e2e:
    name: E2E — Playwright Electron Smoke
    runs-on: ubuntu-latest
    needs: ci
    # Only run on PRs to dev/main — not on every push to feature branches.
    # Electron build is slow (~8–10 min); unit feedback stays fast.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Cache Electron build output
        uses: actions/cache@v4
        with:
          path: packages/gui/out
          key: electron-out-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/gui/src/**') }}
          restore-keys: electron-out-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium + system deps
        run: pnpm --filter @score/gui exec playwright install --with-deps chromium

      - name: Build all workspace packages + Electron app
        run: pnpm run build

      - name: Start Xvfb (headless display for Electron)
        run: Xvfb :99 -screen 0 1280x720x24 &

      - name: Run e2e smoke tests
        run: pnpm --filter @score/gui test:e2e
        env:
          DISPLAY: ':99.0'
